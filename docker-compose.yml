# Développement : montage des sources, serveurs avec rechargement auto.
# Accès unique via nginx (http://localhost:8080) ; db/backend/frontend ne publient aucun port.
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: anep
      POSTGRES_USER: anep
      POSTGRES_PASSWORD: anep
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anep -d anep"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "until python -c \"import socket; s=socket.create_connection(('db',5432),2); s.close()\"; do sleep 1; done && python manage.py migrate --noinput && python manage.py seed_data && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "dev-change-me"
      POSTGRES_HOST: db
      POSTGRES_DB: anep
      POSTGRES_USER: anep
      POSTGRES_PASSWORD: anep
      DJANGO_ALLOWED_HOSTS: "*"
    volumes:
      - ./backend:/app
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: /api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pg_data:
