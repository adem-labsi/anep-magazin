# Production : images compilées (sans montage de sources), secret via .env.
# Accès unique via nginx (http://localhost:48123) ; db/backend/frontend ne publient aucun port.
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: anep
      POSTGRES_USER: anep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anep}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anep -d anep"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "until python -c \"import socket; s=socket.create_connection(('db',5432),2); s.close()\"; do sleep 1; done && python manage.py migrate --noinput && python manage.py seed_data && gunicorn anep_backend.wsgi -b 0.0.0.0:8000 --workers 3 --timeout 120"
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      POSTGRES_HOST: db
      POSTGRES_DB: anep
      POSTGRES_USER: anep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anep}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "48123:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pg_data:
